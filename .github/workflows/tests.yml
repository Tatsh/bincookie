---
concurrency:
  cancel-in-progress: true
  group: '${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}'
jobs:
  build:
    env:
      COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    name: 'Tests'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          persist-credentials: false
      - name: Install tools
        run: pipx install cpp-coveralls && sudo apt-get update -y && sudo apt-get install -y doxygen graphviz lcov ninja-build
      - name: Configure
        run: cmake -G Ninja -B "${GITHUB_WORKSPACE}/build" -DCMAKE_TOOLCHAIN_FILE="${VCPKG_INSTALLATION_ROOT}/scripts/buildsystems/vcpkg.cmake" -DCMAKE_BUILD_TYPE=Release -DCMAKE_VERBOSE_MAKEFILE=ON -DWITH_DOCS=ON -DWITH_TESTS=ON -DWITH_EXAMPLES=ON --install-prefix "${GITHUB_WORKSPACE}/build/prefix"
      - name: Build
        run: cmake --build "${GITHUB_WORKSPACE}/build"
      - name: Install
        run: cmake --install "${GITHUB_WORKSPACE}/build"
      - name: Run tests
        run: ctest --test-dir "${GITHUB_WORKSPACE}/build"
      - name: Generate coverage information
        run: >-
          lcov -c -d "${GITHUB_WORKSPACE}/build" -o coverage1.lcov
          --include bincookie.h
          --keep-going
      - name: Coveralls
        uses: 'coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329'
name: Tests
'on':
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
permissions: {}
