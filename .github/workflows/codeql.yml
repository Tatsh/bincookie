---
concurrency:
  cancel-in-progress: true
  group: '${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}'
jobs:
  analyze:
    name: 'Analyze (${{ matrix.language }})'
    permissions:
      actions: read
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          persist-credentials: false
      - if: matrix.language == 'c-cpp'
        name: Install Ninja
        run: sudo apt-get update -y && sudo apt-get install -y ninja-build
      - if: matrix.language == 'c-cpp'
        name: Configure
        run: cmake -G Ninja -DCMAKE_TOOLCHAIN_FILE="${VCPKG_INSTALLATION_ROOT}/scripts/buildsystems/vcpkg.cmake" -DWITH_EXAMPLES=ON -DWITH_TESTS=ON -B "${GITHUB_WORKSPACE}/build"
      - name: Initialize CodeQL
        uses: 'github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2'
        with:
          build-mode: ${{ matrix.build-mode }}
          languages: ${{ matrix.language }}
      - if: matrix.language == 'c-cpp'
        name: Build
        run: cmake --build "${GITHUB_WORKSPACE}/build"
      - name: Perform CodeQL Analysis
        uses: 'github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2'
        with:
          category: '/language:${{ matrix.language }}'
    strategy:
      fail-fast: false
      matrix:
        include:
          - build-mode: none
            language: actions
          - build-mode: manual
            language: c-cpp
name: CodeQL
'on':
  pull_request:
    branches: ['master']
  push:
    branches: ['master']
  schedule:
    - cron: 19 1 * * 1
permissions: {}
